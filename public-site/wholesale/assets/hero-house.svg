<linearGradient id="lawn" x1="0" x2="1"><stop stop-color="#789f86"/><stop offset="1" stop-color="#abc4a4"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
