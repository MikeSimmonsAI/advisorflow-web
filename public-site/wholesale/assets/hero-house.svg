<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 640" role="img" aria-labelledby="title desc">
<title id="title">Modern home illustration</title><desc id="desc">Architectural illustration of a modern two-story home surrounded by landscaping.</desc>
<defs>
<linearGradient id="sky" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#dcece9"/><stop offset="1" stop-color="#eae5d4"/></linearGradient>
