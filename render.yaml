# render.yaml — Render Blueprint
#
# This file lets Mike deploy the entire backend + database in one step
# instead of manually clicking through Render's UI for each piece.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In Render: New > Blueprint, connect the repo.
#   3. Render reads this file and provisions everything below automatically.
#   4. Render will prompt for the secret env vars marked "sync: false"
#      below (Twilio, SendGrid, Google, etc.) - it can't generate those
#      for you since they come from your own accounts.
#
# Everything else (DATABASE_URL, JWT_SECRET, ENCRYPTION_KEY) is generated
# automatically by Render - no manual key generation needed.

databases:
  - name: advisorflow-db
    plan: basic-256mb
    databaseName: advisorflow
    user: advisorflow

services:
  - type: web
    name: advisorflow-backend
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    # ── BUILD FILTER ────────────────────────────────────────────────────────
    # In August, 455 commits landed on main and 113 of them touched
    # frontend/dist and NOTHING else. Every one still triggered a full
    # `pip install` here and on four other Python services, because no service
    # had a build filter. Add the pushes that changed only a root-level
    # scratch .ps1, or only a .md, and the workspace burned 1,502 pipeline
    # minutes against a 500-minute allowance — which is what blocked every
    # deploy from Aug 27 7:20 PM onward.
    #
    # DENYLIST, NOT ALLOWLIST, ON PURPOSE. An allowlist (`paths:`) fails toward
    # NOT deploying — forget one entry and a legitimate change silently never
    # ships, which is far worse than a wasted build. `ignoredPaths` fails toward
    # deploying: anything not named here still triggers a build. Render skips
    # the build only when EVERY changed file in the commit matches.
    #
    # Everything listed below is provably never read by this service at build
    # or run time: scripts/ are the deploy gates (run on the developer's machine
    # BEFORE the push), tests/ are never executed by Render, and the rest are
    # frontend assets or documentation.
    buildFilter: &pythonBuildFilter
      ignoredPaths:
        - "frontend/**"
        - "booking-app/**"
        - "demos/**"
        - "docs/**"
        - "review_artifacts/**"
        - "scripts/**"
        - "tests/**"
        - "dist/**"
        - ".perfdump/**"
        - "**/*.md"
        - "*.bat"
        - "*.ps1"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: BOOKING_BASE_URL
        value: https://advisorflow-booking.vercel.app
      - key: FRONTEND_URL
        value: https://advisorflow-frontend.onrender.com
      # THIS SERVICE'S OWN PUBLIC ORIGIN. Twilio delivery receipts are POSTed to
      # API_BASE_URL + /sms/webhook/status-callback. It was never declared here,
      # so the send path resolved "" and dropped the status_callback parameter
      # on every message — 3,583 sends over 30 days, not one receipt, and no
      # error anywhere because an absent callback looks exactly like a message
      # that has not been reported on yet. Do not remove it.
      #
      # NOTE: only `VITE_API_BASE_URL` existed before, on the FRONTEND service.
      # That is a build-time variable for the static site and has never been
      # visible to this process.
      - key: API_BASE_URL
        value: https://advisorflow-backend.onrender.com
      # Required to VERIFY the X-Twilio-Signature on inbound webhooks. Without
      # it app/utils/twilio_security.py logs a warning and accepts the request
      # unvalidated, which is how spoofed delivery receipts and fake inbound
      # replies would get in.
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://advisorflow-backend.onrender.com/calendar/oauth/callback
      - key: MICROSOFT_REDIRECT_URI
        value: https://advisorflow-backend.onrender.com/microsoft/oauth/callback
      - key: SUPER_ADMIN_EMAIL
        sync: false  # Set to simmonsmj242@gmail.com (or new super-admin email) in Render dashboard
      - key: BOOKING_SECRET
        generateValue: true  # cryptographic token for booking link signing
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false

  - type: web
    name: advisorflow-frontend
    runtime: static
    buildCommand: "echo using pre-built dist"
    staticPublishPath: frontend/dist
    # ── BUILD FILTER ────────────────────────────────────────────────────────
    # Mirror image of the Python filter: this service publishes the committed
    # contents of frontend/dist and its build command is a literal `echo`, so
    # nothing under app/, alembic/, tests/ or scripts/ can change a single byte
    # of what it serves — yet all 90 pushes in August rebuilt it.
    #
    # DENYLIST, NOT ALLOWLIST, for the same reason as the backend: the tempting
    # allowlist here is `paths: ["frontend/dist/**"]`, and it is a trap. It
    # would also skip a change to THIS FILE — the rewrite rule and
    # VITE_API_BASE_URL both live below — so a routing or API-origin change
    # would silently never ship. Anything not named here still builds.
    #
    # frontend/src/** is deliberately NOT ignored. dist is pre-built and
    # committed, so a src-only commit needs no deploy, but ignoring src would
    # break the day the build command starts compiling from source. The cost of
    # being wrong in that direction is a stale production frontend; the cost of
    # being wrong in this direction is one `echo`.
    buildFilter:
      ignoredPaths:
        - "app/**"
        - "alembic/**"
        - "booking-app/**"
        - "demos/**"
        - "docs/**"
        - "review_artifacts/**"
        - "scripts/**"
        - "tests/**"
        - ".perfdump/**"
        - "**/*.md"
        - "**/*.py"
        - "*.bat"
        - "*.ps1"
        - "requirements.txt"
        - "requirements-dev.txt"
        - "pytest.ini"
        - "alembic.ini"
    # Catch-all rewrite so React Router handles deep links on hard refresh.
    # Without this, Render's static server returns 404 for /leads/123, /settings, etc.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://advisorflow-backend.onrender.com

  - type: cron
    name: advisorflow-cadence-job
    runtime: python
    schedule: "0 14 * * *"  # Daily at 2pm UTC (~9am Central) — adjust for your timezone
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app/jobs/run_cadence_job.py"
    buildFilter: *pythonBuildFilter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        sync: false  # use the SAME value generated for advisorflow-backend
      - key: ENCRYPTION_KEY
        sync: false  # use the SAME value generated for advisorflow-backend
      - key: BOOKING_BASE_URL
        value: https://advisorflow-booking.vercel.app
      # The cadence job is the highest-volume SENDER in the product, so it needs
      # the callback origin too — its messages write Message rows that the
      # dashboard reads, and without this every one of them is stuck 'pending'.
      - key: API_BASE_URL
        value: https://advisorflow-backend.onrender.com

  # ── Email reply poller — runs every 2 minutes ──────────────────────────────
  # Polls all M365-connected advisor inboxes for new lead replies and feeds
  # them into the AI pipeline. Mirrors the pattern of advisorflow-cadence-job.
  - type: cron
    name: advisorflow-email-poller
    runtime: python
    # SCHEDULE UNCHANGED IN THIS PASS, deliberately. Every-minute polling costs
    # 171.26 hours of runtime a month ($1.61) — 7x more than any other cron.
    # Moving to */3 would cut it to ~57 hours (~$0.54, saving ~$1.07/month) and
    # was accepted in principle, but it is a behaviour change (inbound email
    # pickup latency 60s -> 180s) and Tier 1 changes no behaviour. Decide it
    # separately.
    schedule: "* * * * *"   # Every 1 minute
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app/jobs/run_email_poller.py"
    buildFilter: *pythonBuildFilter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        sync: false  # use the SAME value as advisorflow-backend
      - key: ENCRYPTION_KEY
        sync: false  # use the SAME value as advisorflow-backend
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # ── AI Conversation scheduler — runs every 15 minutes ─────────────────────
  - type: cron
    name: advisorflow-ai-conversation
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app/jobs/run_ai_conversation_job.py"
    buildFilter: *pythonBuildFilter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: BOOKING_BASE_URL
        value: https://advisorflow-booking.vercel.app
      - key: FRONTEND_URL
        value: https://advisorflow-frontend.onrender.com

  # ── AI Voice WebSocket service ─────────────────────────────────────────────
  # Handles Twilio Media Stream WebSocket connections for AI voice calls.
  # Must be a persistent web service (not cron) to maintain WebSocket connections.
  - type: web
    name: advisorflow-voice
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    buildFilter: *pythonBuildFilter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: BOOKING_BASE_URL
        value: https://advisorflow-booking.vercel.app
      - key: FRONTEND_URL
        value: https://advisorflow-frontend.onrender.com
      - key: BACKEND_URL
        value: https://advisorflow-backend.onrender.com
      - key: TWILIO_AUTH_TOKEN
        sync: false
