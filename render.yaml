# render.yaml — Render Blueprint
#
# This file lets Mike deploy the entire backend + database in one step
# instead of manually clicking through Render's UI for each piece.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In Render: New > Blueprint, connect the repo.
#   3. Render reads this file and provisions everything below automatically.
#   4. Render will prompt for the secret env vars marked "sync: false"
#      below (Twilio, SendGrid, Google, etc.) - it can't generate those
#      for you since they come from your own accounts.
#
# Everything else (DATABASE_URL, JWT_SECRET, ENCRYPTION_KEY) is generated
# automatically by Render - no manual key generation needed.

databases:
  - name: advisorflow-db
    plan: basic-256mb
    databaseName: advisorflow
    user: advisorflow

services:
  - type: web
    name: advisorflow-backend
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: BOOKING_BASE_URL
        value: https://advisorflow-booking.vercel.app
      - key: FRONTEND_URL
        value: https://advisorflow-frontend.onrender.com
      # THIS SERVICE'S OWN PUBLIC ORIGIN. Twilio delivery receipts are POSTed to
      # API_BASE_URL + /sms/webhook/status-callback. It was never declared here,
      # so the send path resolved "" and dropped the status_callback parameter
      # on every message — 3,583 sends over 30 days, not one receipt, and no
      # error anywhere because an absent callback looks exactly like a message
      # that has not been reported on yet. Do not remove it.
      #
      # NOTE: only `VITE_API_BASE_URL` existed before, on the FRONTEND service.
      # That is a build-time variable for the static site and has never been
      # visible to this process.
      - key: API_BASE_URL
        value: https://advisorflow-backend.onrender.com
      # Required to VERIFY the X-Twilio-Signature on inbound webhooks. Without
      # it app/utils/twilio_security.py logs a warning and accepts the request
      # unvalidated, which is how spoofed delivery receipts and fake inbound
      # replies would get in.
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://advisorflow-backend.onrender.com/calendar/oauth/callback
      - key: MICROSOFT_REDIRECT_URI
        value: https://advisorflow-backend.onrender.com/microsoft/oauth/callback
      - key: SUPER_ADMIN_EMAIL
        sync: false  # Set to simmonsmj242@gmail.com (or new super-admin email) in Render dashboard
      - key: BOOKING_SECRET
        generateValue: true  # cryptographic token for booking link signing
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false

  - type: web
    name: advisorflow-frontend
    runtime: static
    buildCommand: "echo using pre-built dist"
    staticPublishPath: frontend/dist
    # Catch-all rewrite so React Router handles deep links on hard refresh.
    # Without this, Render's static server returns 404 for /leads/123, /settings, etc.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://advisorflow-backend.onrender.com

  - type: cron
    name: advisorflow-cadence-job
    runtime: python
    schedule: "0 14 * * *"  # Daily at 2pm UTC (~9am Central) — adjust for your timezone
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app/jobs/run_cadence_job.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        sync: false  # use the SAME value generated for advisorflow-backend
      - key: ENCRYPTION_KEY
        sync: false  # use the SAME value generated for advisorflow-backend
      - key: BOOKING_BASE_URL
        value: https://advisorflow-booking.vercel.app
      # The cadence job is the highest-volume SENDER in the product, so it needs
      # the callback origin too — its messages write Message rows that the
      # dashboard reads, and without this every one of them is stuck 'pending'.
      - key: API_BASE_URL
        value: https://advisorflow-backend.onrender.com

  # ── Email reply poller — runs every 2 minutes ──────────────────────────────
  # Polls all M365-connected advisor inboxes for new lead replies and feeds
  # them into the AI pipeline. Mirrors the pattern of advisorflow-cadence-job.
  - type: cron
    name: advisorflow-email-poller
    runtime: python
    schedule: "* * * * *"   # Every 1 minute
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app/jobs/run_email_poller.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        sync: false  # use the SAME value as advisorflow-backend
      - key: ENCRYPTION_KEY
        sync: false  # use the SAME value as advisorflow-backend
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # ── AI Conversation scheduler — runs every 15 minutes ─────────────────────
  - type: cron
    name: advisorflow-ai-conversation
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app/jobs/run_ai_conversation_job.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: BOOKING_BASE_URL
        value: https://advisorflow-booking.vercel.app
      - key: FRONTEND_URL
        value: https://advisorflow-frontend.onrender.com

  # ── AI Voice WebSocket service ─────────────────────────────────────────────
  # Handles Twilio Media Stream WebSocket connections for AI voice calls.
  # Must be a persistent web service (not cron) to maintain WebSocket connections.
  - type: web
    name: advisorflow-voice
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: advisorflow-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: BOOKING_BASE_URL
        value: https://advisorflow-booking.vercel.app
      - key: FRONTEND_URL
        value: https://advisorflow-frontend.onrender.com
      - key: BACKEND_URL
        value: https://advisorflow-backend.onrender.com
      - key: TWILIO_AUTH_TOKEN
        sync: false
