# No credentials, network sources or production data: isolated SQLite fixtures.
# Prevent a regression in EvoSense run/error accounting before a production merge.
name: EvoSense source reliability

on:
  pull_request:
    paths:
      - 'app/services/evosense/hunt.py'
      - 'tests/test_evosense_dfw_sources.py'
      - 'tests/test_evosense_roll_layout_fix.py'
      - '.github/workflows/evosense-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile changed backend module
        run: python -m py_compile app/services/evosense/hunt.py
      - name: Run source and rollback regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -o addopts='' tests/test_evosense_dfw_sources.py tests/test_evosense_roll_layout_fix.py
