name: SCI native mobile pilot checks
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-sci-pilot-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked Expo dependencies
        run: npm ci --include=dev
      - name: TypeScript
        run: npm run typecheck
      - name: Jest regression suite
        run: npm run test:ci -- --runInBand
      - name: Validate Expo configuration
        run: npx expo config --type public --json > /dev/null
