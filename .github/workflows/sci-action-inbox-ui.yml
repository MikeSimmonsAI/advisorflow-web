name: SCI inbox and engagement UI

on:
  pull_request:
    paths:
      - 'frontend/src/pages/program/sci/Responses.jsx'
      - 'frontend/src/pages/program/sci/OutreachPulse.jsx'
      - 'frontend/src/pages/program/sci/inboxModel.js'
      - 'frontend/src/pages/program/ProgramCenter.css'
      - 'frontend/src/pages/program/command/Performance.jsx'
      - 'frontend/src/pages/program/command/Performance.css'
      - 'frontend/tests/sci-inbox-model.test.mjs'
      - '.github/workflows/sci-action-inbox-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sci-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test queue priority and metrics
        run: node --test tests/sci-inbox-model.test.mjs
      - name: Build production frontend
        run: npm run build
