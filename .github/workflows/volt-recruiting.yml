# VOLT Marketing recruiting program (#535): backend contract tests + frontend build.
name: VOLT Marketing recruiting

on:
  pull_request:
    paths:
      - 'app/models/volt_models.py'
      - 'app/services/volt/**'
      - 'app/routers/volt_router.py'
      - 'app/deps.py'
      - 'app/services/workspace_access.py'
      - 'app/migrate.py'
      - 'frontend/src/pages/volt/**'
      - 'frontend/src/pages/program/programAccessModel.js'
      - 'frontend/src/App.jsx'
      - 'tests/test_volt_recruiting.py'
      - '.github/workflows/volt-recruiting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile VOLT backend
        run: python -m py_compile app/models/volt_models.py app/routers/volt_router.py app/services/volt/*.py
      - name: VOLT release checklist tests + neighbouring access tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -o addopts='' tests/test_volt_recruiting.py tests/test_acquisition_owner_access.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify frontend build
        working-directory: frontend
        run: npm run build
