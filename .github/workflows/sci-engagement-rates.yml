name: SCI engagement rates

on:
  pull_request:
    paths:
      - 'app/services/programs/sci_analytics.py'
      - 'tests/test_sci_analytics.py'
      - 'frontend/src/pages/program/command/Performance.jsx'
      - 'frontend/src/pages/program/command/Performance.css'
      - 'frontend/src/pages/program/command/rateModel.js'
      - 'frontend/src/pages/program/sci/OutreachPulse.jsx'
      - 'frontend/src/pages/program/ProgramCenter.css'
      - 'frontend/tests/sci-engagement-percentages.test.mjs'
      - '.github/workflows/sci-engagement-rates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile app/services/programs/sci_analytics.py tests/test_sci_analytics.py
      - name: Validate SCI analytics and response denominators
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -o addopts='' tests/test_sci_analytics.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Verify percentage math and queue ordering
        run: node --test tests/sci-engagement-percentages.test.mjs tests/sci-inbox-model.test.mjs
      - name: Production build
        run: npm run build
