# P0 - Owner's permanent foreclosure priority policy includes Acquisition Command.
# This workflow must run on changes to the policy, dashboard query, display, or tests.
name: Wholesale Acquisition Command priority

on:
  pull_request:
    paths:
      - 'app/services/evosense/views.py'
      - 'app/services/evosense/scoring.py'
      - 'app/services/evosense/evaluate.py'
      - 'app/services/evosense/work_priority.py'
      - 'frontend/src/pages/wholesale/evosense/EvoCommand.jsx'
      - 'frontend/src/pages/wholesale/evosense/Measures.jsx'
      - 'tests/test_foreclosure_priority_policy.py'
      - 'tests/test_evosense_urgency_measures.py'
      - 'tests/test_evosense_foreclosure_claims.py'
      - '.github/workflows/wholesale-command-priority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  priority-and-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile priority backend
        run: python -m py_compile app/services/evosense/views.py app/services/evosense/work_priority.py app/services/evosense/scoring.py app/services/evosense/evaluate.py
      - name: Enforce permanent foreclosure policy (including Acquisition Command)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -o addopts='' tests/test_foreclosure_priority_policy.py tests/test_evosense_urgency_measures.py tests/test_evosense_foreclosure_claims.py tests/test_evosense_derive_v3.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify frontend build
        working-directory: frontend
        run: npm run build
