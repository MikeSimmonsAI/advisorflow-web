plugins {
    id 'com.android.application'
}

// The build number comes from GitHub (each build is one higher), so every
// new file installs over the last one.
def buildNumber = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'live.evosyspro.field'
    compileSdk 35

    defaultConfig {
        applicationId 'live.evosyspro.field'
        minSdk 23
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        manifestPlaceholders = [hostName: 'app.evosyspro.live', defaultUrl: 'https://app.evosyspro.live/wholesale/appointments']
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'no-key.p12')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'evosys-field'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
